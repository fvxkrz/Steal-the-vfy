name: Verify service and container
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build && npm run replay
      - run: npm run artifacts:verify && npm audit --omit=dev
      - name: Build production image
        run: docker build --tag proof-steal-vfy-ci .
      - name: Exercise non-root read-only image without real credentials
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/steal-vfy-ci.env"
          export ENV_FILE
          node -e 'require("node:fs").writeFileSync(process.env.ENV_FILE, "AGENT_GAMES_HMAC_SECRET="+require("node:crypto").randomBytes(32).toString("hex")+"\n", {mode:0o600})'
          trap 'docker rm -f steal-vfy-smoke >/dev/null 2>&1 || true; rm -f "$ENV_FILE"' EXIT
          docker run --detach --name steal-vfy-smoke --env-file "$ENV_FILE" \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /app/data:uid=1000,gid=1000,mode=700,size=32m \
            --pids-limit 64 --memory 1g --publish 127.0.0.1:33001:3001 proof-steal-vfy-ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:33001/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:33001/healthz >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33001/readyz)" = "503"
